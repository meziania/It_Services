name: Keep Render API awake

# Free-tier Render sleeps after ~15 min idle. Ping /health every 10 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          set -euo pipefail
          URL="${API_URL:-https://serviceit-scanner-api.onrender.com}"
          URL="${URL%/}"
          echo "Pinging ${URL}/health"
          curl -fsS --max-time 90 "${URL}/health"
          echo
          echo "OK"
